<head>
<meta charset="utf-8">

<title>PAK'nSAVE Grocery Route</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f3f4f6;color:#111827}
header{position:sticky;top:0;z-index:10;background:#111827;color:white;padding:14px 14px 10px;box-shadow:0 2px 10px #0002}
h1{font-size:20px;margin:0 0 10px}.tabs{display:flex;gap:6px}.tab{flex:1;border:0;border-radius:10px;padding:10px;background:#374151;color:white;font-weight:700}.tab.active{background:white;color:#111827}
main{max-width:760px;margin:auto;padding:12px 12px 100px}.bar{display:flex;gap:8px;align-items:center;margin-bottom:10px}.bar input{flex:1;padding:12px;border:1px solid #d1d5db;border-radius:10px;font-size:16px}
button{font:inherit}.primary{background:#111827;color:white;border:0;border-radius:10px;padding:12px 14px;font-weight:700}.secondary{background:white;border:1px solid #d1d5db;border-radius:10px;padding:10px 12px}
.card{background:white;border-radius:14px;margin:8px 0;padding:12px;box-shadow:0 1px 4px #0001}.row{display:flex;align-items:center;gap:10px}.itemname{font-weight:700;flex:1}.cat{font-size:12px;color:#6b7280;margin-top:3px}
.buy{width:42px;height:42px;border-radius:12px;border:2px solid #9ca3af;background:white;font-size:20px}.buy.done{background:#111827;color:white;border-color:#111827}.qty{display:flex;align-items:center;gap:5px}.qty input{width:54px;text-align:center;padding:7px;border:1px solid #d1d5db;border-radius:8px}.qty select{padding:7px;border:1px solid #d1d5db;border-radius:8px;background:white}
.section{margin-top:18px}.section h2{font-size:15px;margin:0 4px 7px;text-transform:uppercase;letter-spacing:.05em;color:#4b5563}
.muted{color:#6b7280;font-size:13px}.empty{padding:30px;text-align:center;color:#6b7280}.stats{display:flex;gap:8px;margin-bottom:10px}.stat{background:white;border-radius:12px;padding:10px;flex:1;text-align:center}.stat b{display:block;font-size:20px}
.modal{position:fixed;inset:0;background:#0007;display:none;z-index:20;padding:18px}.modal.show{display:flex;align-items:flex-end}.sheet{background:white;border-radius:18px 18px 0 0;width:100%;max-height:85vh;overflow:auto;padding:16px}.sheet h2{margin-top:0}.sheet input,.sheet select{width:100%;padding:12px;margin:5px 0;border:1px solid #d1d5db;border-radius:10px;font-size:16px}.actions{display:flex;gap:8px;margin-top:10px}.actions button{flex:1}
@media(min-width:650px){.modal.show{align-items:center;justify-content:center}.sheet{max-width:520px;border-radius:18px}}
</style>

<style>
  #access-lock {
    position: fixed;
    inset: 0;
    z-index: 99999;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    background: #f5f5f5;
  }
  #access-lock.hidden { display: none; }
  .access-card {
    width: min(100%, 380px);
    padding: 28px;
    border-radius: 20px;
    background: white;
    box-shadow: 0 10px 35px rgba(0,0,0,.12);
    text-align: center;
  }
  .access-card h1 { margin: 0 0 8px; font-size: 24px; }
  .access-card p { margin: 0 0 20px; color: #666; }
  #access-code {
    width: 100%;
    box-sizing: border-box;
    padding: 14px 16px;
    border: 1px solid #ccc;
    border-radius: 12px;
    font-size: 18px;
    text-align: center;
    letter-spacing: 3px;
  }
  #unlock-app {
    width: 100%;
    margin-top: 12px;
    padding: 14px 16px;
    border: 0;
    border-radius: 12px;
    font-size: 17px;
    font-weight: 700;
    cursor: pointer;
  }
  #access-error { min-height: 22px; margin-top: 10px; color: #b00020; font-size: 14px; }
</style>

</head>
<body>

<div id="access-lock">
  <div class="access-card">
    <h1>🔒 Private App</h1>
    <p>Enter the family access code to continue.</p>
    <input id="access-code" type="password" inputmode="numeric" autocomplete="off"
           placeholder="Access code" aria-label="Family access code">
    <button id="unlock-app" type="button">Unlock</button>
    <div id="access-error" role="alert"></div>
  </div>
</div>

<header>
<h1>PAK'nSAVE Grocery Route</h1>
<div class="tabs">
<button class="tab active" id="tabShop">This Week</button>
<button class="tab" id="tabMaster">Master List</button>
<button class="tab" id="tabRoute">Route</button>
</div>
</header>
<main id="app"></main>

"Body Soap","category":"Personal Care","usualQty":"1","usualUnit":"pack","shopQty":"1","shopUnit":"pack"},{"id":"Mouthwash","name":"Mouthwash","category":"Personal Care","usualQty":"1","usualUnit":"bottle","shopQty":"1","shopUnit":"bottle"},{"id":"Denture Cleaner","name":"Denture Cleaner","category":"Personal Care","usualQty":"1","usualUnit":"pack","shopQty":"1","shopUnit":"pack"},{"id":"Paper Towels","name":"Paper Towels","category":"Household & Cleaning","usualQty":"1","usualUnit":"pack","shopQty":"1","shopUnit":"pack"},{"id":"Toilet Paper","name":"Toilet Paper","category":"Household & Cleaning","usualQty":"1","usualUnit":"pack","shopQty":"1","shopUnit":"pack"},{"id":"Laundry Sheets","name":"Laundry Sheets","category":"Household & Cleaning","usualQty":"1","usualUnit":"pack","shopQty":"1","shopUnit":"pack"},{"id":"Dishwashing Liquid","name":"Dishwashing Liquid","category":"Household & Cleaning","usualQty":"1","usualUnit":"bottle","shopQty":"1","shopUnit":"bottle"},{"id":"Glad Wrap","name":"Glad Wrap","category":"Household & Cleaning","usualQty":"1","usualUnit":"roll","shopQty":"1","shopUnit":"roll"},{"id":"Baking Paper","name":"Baking Paper","category":"Household & Cleaning","usualQty":"1","usualUnit":"roll","shopQty":"1","shopUnit":"roll"},{"id":"Tin Foil","name":"Tin Foil","category":"Household & Cleaning","usualQty":"1","usualUnit":"roll","shopQty":"1","shopUnit":"roll"},{"id":"Toilet Cleaner","name":"Toilet Cleaner","category":"Household & Cleaning","usualQty":"1","usualUnit":"bottle","shopQty":"1","shopUnit":"bottle"},{"id":"Rubber Gloves","name":"Rubber Gloves","category":"Household & Cleaning","usualQty":"1","usualUnit":"pair","shopQty":"1","shopUnit":"pair"}];
const CATEGORIES=[
  "Fruit & Vegetables",
  "Bread & Bakery",
  "Fridge, Dairy & Eggs",
  "Meat & Seafood",
  "Pantry",
  "Oils, Sauces, Condiments & Spices",
  "Frozen",
  "Drinks",
  "Jars, Pickles & Preserved",
  "Baking & Cooking Essentials",
  "Pasta & Noodles",
  "Asian Ingredients",
  "Personal Care",
  "Household & Cleaning",
  "Other"
];
  const KEY="pns-grocery-v1";
let state=JSON.parse(localStorage.getItem(KEY)||"null")||{
 items:BASE_ITEMS.map(x=>({...x,selected:false,bought:false})),
 route:[], pairs:{}, shopStarted:null
};
function save(){localStorage.setItem(KEY,JSON.stringify(state))}
function esc(s){return s.replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function routeScore(id){
 let score=0;
 for(const k in state.pairs){ if(k.startsWith(id+"|")) score+=state.pairs[k]; if(k.endsWith("|"+id)) score-=state.pairs[k]; }
 return score;
}
function sortedSelected(){
 return state.items.filter(x=>x.selected).sort((a,b)=>routeScore(a.id)-routeScore(b.id)||state.items.indexOf(a)-state.items.indexOf(b));
}
function recordBuy(id){
 const it=state.items.find(x=>x.id===id); if(!it||it.bought)return;
 if(!state.shopStarted)state.shopStarted=Date.now();
 const prev=state.route[state.route.length-1];
 if(prev&&prev!==id){const k=prev+"|"+id;state.pairs[k]=(state.pairs[k]||0)+1}
 state.route.push(id);it.bought=true;save();render();
}
function render(){
 const app=document.getElementById("app");
 if(window.view==="master") renderMaster(app);
 else if(window.view==="route") renderRoute(app);
 else renderShop(app);
}
function renderShop(app){
 const sel=sortedSelected(), bought=sel.filter(x=>x.bought).length;
 app.innerHTML=`<div class="stats"><div class="stat"><b>${sel.length}</b>Items</div><div class="stat"><b>${bought}</b>Bought</div><div class="stat"><b>${sel.length-bought}</b>Left</div></div>
 <div class="bar"><input id="search" placeholder="Search this week's shop…"><button class="primary" onclick="openAdd()">Add</button></div>
 <div class="bar"><button class="secondary" onclick="selectAll(false)">Clear shop</button><button class="secondary" onclick="resetBought()">New trip</button></div>
 ${sel.length?sel.map(itemCard).join(""):`<div class="empty">Your weekly shop is empty.<br><br>Go to <b>Master List</b> and tap items to add them.</div>`}`;
 document.getElementById("search").oninput=e=>filterCards(e.target.value);
}
function itemCard(x){
 return `<div class="card item-card" data-name="${esc(x.name.toLowerCase())}"><div class="row">
 <button class="buy ${x.bought?"done":""}" onclick="buy('${esc(x.id)}')">${x.bought?"✓":"○"}</button>
 <div class="itemname">${esc(x.name)}<div class="cat">${esc(x.category)}</div></div>
 <div class="qty"><input type="number" min="0" step="any" value="${esc(x.shopQty)}" onchange="setQty('${esc(x.id)}',this.value)"><select onchange="setUnit('${esc(x.id)}',this.value)">${["each","bunch","kg","g","pack","bag","box","tin","jar","tub","bottle","loaf","tube","roll","pair","dozen","litre","ml"].map(u=>`<option ${u===x.shopUnit?"selected":""}>${u}</option>`).join("")}</select></div>
 </div></div>`;
}
function renderMaster(app){
 const groups={};state.items.forEach(x=>(groups[x.category]??=[]).push(x));
 app.innerHTML=`<div class="bar"><input id="search" placeholder="Search master list…"><button class="primary" onclick="openAdd()">Add</button></div>
 <p class="muted">Tap an item to include it in this week's shop. Quantities are saved automatically.</p>
 ${Object.entries(groups).map(([cat,arr])=>`<div class="section"><h2>${esc(cat)}</h2>${arr.map(x=>`<div class="card item-card" data-name="${esc(x.name.toLowerCase())}"><div class="row">
 <button class="buy ${x.selected?"done":""}" onclick="toggleSelect('${esc(x.id)}')">${x.selected?"✓":"+"}</button>
 <div class="itemname">${esc(x.name)}<div class="cat">${esc(x.shopQty)} ${esc(x.shopUnit)} · usual ${esc(x.usualQty)} ${esc(x.usualUnit)}</div></div>
 <button class="secondary" onclick="editItem('${esc(x.id)}')">Edit</button>
<button class="secondary" onclick="deleteItem('${esc(x.id)}')">Delete</button>
 </div></div>`).join("")}</div>`).join("")}`;
 document.getElementById("search").oninput=e=>filterCards(e.target.value);
}
function renderRoute(app){
 const sel=sortedSelected(), known=sel.filter(x=>state.route.includes(x.id));
 app.innerHTML=`<div class="card"><b>How route learning works</b><p class="muted">Each time you tap ✓ during a real shop, the app records the order. It learns which items tend to come before others. No aisle numbers and no messages required.</p></div>
 <div class="card"><b>Latest recorded trip</b><p>${state.route.length?state.route.map((id,i)=>`${i+1}. ${esc(id)}`).join("<br>"):"No shopping trip recorded yet."}</p></div>
 <div class="card"><b>Current suggested order</b><p>${sel.length?sel.map((x,i)=>`${i+1}. ${esc(x.name)}`).join("<br>"):"Select items in Master List first."}</p></div>
 <button class="primary" onclick="clearRoute()">Clear learned route</button>`;
}
function filterCards(q){q=q.toLowerCase();document.querySelectorAll(".item-card").forEach(c=>c.style.display=c.dataset.name.includes(q)?"":"none")}
function toggleSelect(id){const x=state.items.find(x=>x.id===id);x.selected=!x.selected;x.bought=false;save();render()}
function selectAll(v){state.items.forEach(x=>{if(!v)x.selected=false;x.bought=false});save();render()}
function setQty(id,v){const x=state.items.find(x=>x.id===id);x.shopQty=v;x.usualQty=v;save()}
function setUnit(id,v){const x=state.items.find(x=>x.id===id);x.shopUnit=v;x.usualUnit=v;save()}
function buy(id){recordBuy(id)}
function resetBought(){state.items.forEach(x=>x.bought=false);state.route=[];state.shopStarted=null;save();render()}
function clearRoute(){if(confirm("Clear the learned route? Your Master List and quantities will stay.")){state.route=[];state.pairs={};save();render()}}
function editItem(id){
  const x=state.items.find(x=>x.id===id);
  if(!x)return;

  document.getElementById("sheet").innerHTML=`
    <h2>Edit item</h2>

    <input id="eiName" value="${esc(x.name)}">

    <select id="eiCat">
      ${CATEGORIES.map(c=>`
        <option ${c===x.category?"selected":""}>${esc(c)}</option>
      `).join("")}
    </select>

    <input id="eiQty" type="number" min="0" step="any" value="${esc(x.usualQty)}">

    <select id="eiUnit">
      ${["each","bunch","kg","g","pack","bag","box","tin","jar","tub","bottle","loaf","tube","roll","pair","dozen","litre","ml"].map(u=>`
        <option ${u===x.usualUnit?"selected":""}>${u}</option>
      `).join("")}
    </select>

    <div class="actions">
      <button class="secondary" onclick="closeModal()">Cancel</button>
      <button class="primary" onclick="saveEdit('${esc(id)}')">Save</button>
    </div>
  `;

  openModal();
}
function saveEdit(id){
  const x=state.items.find(x=>x.id===id);
  if(!x)return;

  x.name=document.getElementById("eiName").value.trim()||x.name;
  x.category=document.getElementById("eiCat").value;
  x.usualQty=document.getElementById("eiQty").value;
  x.shopQty=x.usualQty;
  x.usualUnit=document.getElementById("eiUnit").value;
  x.shopUnit=x.usualUnit;

  save();
  closeModal();
  render();
}
function addItem(){const name=document.getElementById("aiName").value.trim(),cat=document.getElementById("aiCat").value.trim()||"Other";if(!name)return; if(state.items.some(x=>x.name.toLowerCase()===name.toLowerCase()))return alert("That item already exists.");const q=document.getElementById("aiQty").value,u=document.getElementById("aiUnit").value;state.items.push({id:name,name,category:cat,usualQty:q,usualUnit:u,shopQty:q,shopUnit:u,selected:true,bought:false});save();closeModal();render()}
function openModal(){document.getElementById("modal").classList.add("show")}
function closeModal(){document.getElementById("modal").classList.remove("show")}
document.getElementById("modal").onclick=e=>{if(e.target.id==="modal")closeModal()}
document.getElementById("tabShop").onclick=()=>{window.view="shop";setTabs();render()}
document.getElementById("tabMaster").onclick=()=>{window.view="master";setTabs();render()}
document.getElementById("tabRoute").onclick=()=>{window.view="route";setTabs();render()}
function setTabs(){document.querySelectorAll(".tab").forEach(b=>b.classList.remove("active"));document.getElementById(window.view==="master"?"tabMaster":window.view==="route"?"tabRoute":"tabShop").classList.add("active")}
window.view="shop";render();
</script>

<script>
(() => {
  // Family testing access code. Change this before wider distribution.
  const FAMILY_ACCESS_CODE = "2580";
  const ACCESS_KEY = "paknsave_family_access_granted";

  const lock = document.getElementById("access-lock");
  const input = document.getElementById("access-code");
  const button = document.getElementById("unlock-app");
  const error = document.getElementById("access-error");

  function unlock() {
    if (input.value === FAMILY_ACCESS_CODE) {
      localStorage.setItem(ACCESS_KEY, "1");
      lock.classList.add("hidden");
      document.body.style.overflow = "";
    } else {
      error.textContent = "Incorrect access code.";
      input.select();
    }
  }

  if (localStorage.getItem(ACCESS_KEY) === "1") {
    lock.classList.add("hidden");
  } else {
    document.body.style.overflow = "hidden";
    setTimeout(() => input.focus(), 100);
  }

  button.addEventListener("click", unlock);
  input.addEventListener("keydown", (e) => {
    if (e.key === "Enter") unlock();
  });
})();
</script>
