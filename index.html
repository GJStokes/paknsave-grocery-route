.muted{color:#6b7280;font-size:13px}.empty{padding:30px;text-align:center;color:#6b7280}.stats{display:flex;gap:8px;margin-bottom:10px}.stat{background:white;border-radius:12px;padding:10px;flex:1;text-align:center}.stat b{display:block;font-size:20px}

<style>
  #access-lock {
    position: fixed;
    inset: 0;
    z-index: 99999;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    background: #f5f5f5;
  }
  #access-lock.hidden { display: none; }
  .access-card {
    width: min(100%, 380px);
    padding: 28px;
    border-radius: 20px;
    background: white;
    box-shadow: 0 10px 35px rgba(0,0,0,.12);
    text-align: center;
  }
  .access-card h1 { margin: 0 0 8px; font-size: 24px; }
  .access-card p { margin: 0 0 20px; color: #666; }
  #access-code {
    width: 100%;
    box-sizing: border-box;
    padding: 14px 16px;
    border: 1px solid #ccc;
    border-radius: 12px;
    font-size: 18px;
    text-align: center;
    letter-spacing: 3px;
  }
  #unlock-app {
    width: 100%;
    margin-top: 12px;
    padding: 14px 16px;
    border: 0;
    border-radius: 12px;
    font-size: 17px;
    font-weight: 700;
    cursor: pointer;
  }
  #access-error { min-height: 22px; margin-top: 10px; color: #b00020; font-size: 14px; }
</style>

</head>

<div id="access-lock">

</div>

  state.routesByStore={};

}
if(!state.pairsByStore){

function save(){localStorage.setItem(KEY,JSON.stringify(state))}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function routeScore(id,store){
 let score=0; const pairs=state.pairsByStore[store]||{};
 for(const k in pairs){ if(k.startsWith(id+"|")) score+=pairs[k]; if(k.endsWith("|"+id)) score-=pairs[k]; }
 return score;
}
function sortedSelectedByStore(store){
 return state.items.filter(x=>x.selected&&(x.shopStore||x.store||"PAK'nSAVE")===store).sort((a,b)=>routeScore(a.id,store)-routeScore(b.id,store)||a.name.localeCompare(b.name,undefined,{sensitivity:"base"}));
}
function selectedStores(){
 return [...new Set(state.items.filter(x=>x.selected).map(x=>x.shopStore||x.store||"PAK'nSAVE"))].sort((a,b)=>a.localeCompare(b,undefined,{sensitivity:"base"}));
}
function ensureStore(store){
 store=(store||"PAK'nSAVE").trim()||"PAK'nSAVE";
 if(!state.stores.includes(store))state.stores.push(store);
 if(!state.routesByStore[store])state.routesByStore[store]=[];
 if(!state.pairsByStore[store])state.pairsByStore[store]={};
 return store;
}
function recordBuy(id){
 const it=state.items.find(x=>x.id===id); if(!it||it.bought)return;
 const store=ensureStore(it.shopStore||it.store);
 if(!state.shopStarted)state.shopStarted=Date.now();
 const route=state.routesByStore[store];
 const pairs=state.pairsByStore[store];
 const prev=route[route.length-1];
 if(prev&&prev!==id){const k=prev+"|"+id;pairs[k]=(pairs[k]||0)+1}
 route.push(id);
 it.bought=true;
 save();render();
}
function render(){
 const app=document.getElementById("app");
 if(window.view==="master") renderMaster(app);
 else if(window.view==="route") renderRoute(app);
 else renderShop(app);
}

 </div></div>`;
}
function renderMaster(app){
 const groups={};
 state.items.forEach(x=>(groups[x.category]??=[]).push(x));
 const orderedGroups=CATEGORIES.filter(cat=>groups[cat]).map(cat=>[cat,groups[cat].sort((a,b)=>a.name.localeCompare(b.name,undefined,{sensitivity:"base"}))]);
 app.innerHTML=`<div class="bar"><input id="search" placeholder="Search master list…"><button class="primary" onclick="openAdd()">Add Item</button><button class="primary" onclick="openStoreManager()">＋ Add Store</button></div>
 <p class="muted">Tap an item to include it in this week's shop. Quantities are saved automatically.</p>
 ${orderedGroups.map(([cat,arr])=>`<div class="section"><h2>${esc(cat)}</h2>${arr.map(x=>`<div class="card item-card" data-name="${esc(x.name.toLowerCase())}"><div class="row">
 <button class="buy ${x.selected?"done":""}" onclick="toggleSelect('${esc(x.id)}')">${x.selected?"✓":"+"}</button>
 <button class="itemname item-open" type="button" onclick="openShopItem('${esc(x.id)}')">${esc(x.name)}<div class="cat">${esc(x.shopQty)} ${esc(x.shopUnit)} · ${esc(x.shopStore||x.store||"PAK'nSAVE")}</div><div class="storetag">Tap item to set quantity & store</div></button>
 <button class="secondary" onclick="editItem('${esc(x.id)}')">Edit</button>
  <button class="secondary" onclick="deleteItem('${esc(x.id)}')">Delete</button>
 </div></div>`).join("")}</div>`).join("")}`;
 document.getElementById("search").oninput=e=>filterCards(e.target.value);
}
function renderRoute(app){
 const stores=[...new Set(state.items.filter(x=>x.selected).map(x=>x.shopStore||x.store||"PAK'nSAVE"))].sort((a,b)=>a.localeCompare(b,undefined,{sensitivity:"base"}));
 const sections=stores.length?stores.map(store=>{
   const selected=sortedSelectedByStore(store);
   const route=state.routesByStore[store]||[];
   return `<div class="card"><b>${esc(store)}</b><p class="muted">Latest recorded trip</p><p>${route.length?route.map((id,i)=>`${i+1}. ${esc(state.items.find(x=>x.id===id)?.name||id)}`).join("<br>"):"No shopping trip recorded yet."}</p><p class="muted">Current suggested order</p><p>${selected.length?selected.map((x,i)=>`${i+1}. ${esc(x.name)}`).join("<br>"):"No selected items for this store."}</p></div>`;
 }).join(""):`<div class="card"><p>Select items in Master List first.</p></div>`;
 app.innerHTML=`<div class="card"><b>How route learning works</b><p class="muted">The app learns your shopping order separately for each store. Just tap ✓ as you shop. PAK'nSAVE, Woolworths and each specialty store can develop their own route without mixing them together.</p></div>${sections}<button class="primary" onclick="clearRoute()">Clear learned routes</button>`;
}
function filterCards(q){q=q.toLowerCase();document.querySelectorAll(".item-card").forEach(c=>c.style.display=c.dataset.name.includes(q)?"":"none")}
function toggleSelect(id){const x=state.items.find(x=>x.id===id);x.selected=!x.selected;x.bought=false;if(x.selected&&!x.shopStore)x.shopStore=x.store||"PAK'nSAVE";save();render()}
function selectAll(v){state.items.forEach(x=>{if(!v)x.selected=false;x.bought=false});save();render()}
function setQty(id,v){const x=state.items.find(x=>x.id===id);x.shopQty=v;x.usualQty=v;save()}
function setUnit(id,v){const x=state.items.find(x=>x.id===id);x.shopUnit=v;x.usualUnit=v;save()}
function setShopStore(id,v){const x=state.items.find(x=>x.id===id);if(!x)return;const store=ensureStore(v);x.shopStore=store;x.bought=false;save();render()}
function buy(id){recordBuy(id)}
function resetBought(){state.items.forEach(x=>x.bought=false);state.routesByStore={};state.route=[];state.shopStarted=null;save();render()}
function clearRoute(){if(confirm("Clear all learned store routes? Your Master List, stores and quantities will stay.")){state.routesByStore={};state.pairsByStore={};state.route=[];state.pairs={};save();render()}}
function editItem(id){
  const x=state.items.find(x=>x.id===id);
  if(!x)return;
  document.getElementById("sheet").innerHTML=`
    <h2>Edit item</h2>
    <input id="eiName" value="${esc(x.name)}">
    <select id="eiCat">
      ${CATEGORIES.map(c=>`<option ${c===x.category?"selected":""}>${esc(c)}</option>`).join("")}

    </select>
    <div class="actions">
      <button class="secondary" onclick="closeModal()">Cancel</button>
      <button class="primary" onclick="saveEdit('${esc(id)}')">Save</button>

function saveEdit(id){
  const x=state.items.find(x=>x.id===id);
  if(!x)return;
  x.name=document.getElementById("eiName").value.trim()||x.name;
  x.category=document.getElementById("eiCat").value;
  const editStoreValue=document.getElementById("eiStore").value;
  if(editStoreValue!=="__ADD_STORE__") { x.store=ensureStore(editStoreValue); x.shopStore=x.store; }
  x.usualQty=document.getElementById("eiQty").value;
  x.shopQty=x.usualQty;
  x.usualUnit=document.getElementById("eiUnit").value;
  x.shopUnit=x.usualUnit;
  save();closeModal();render();
}
function deleteItem(id){
  const x=state.items.find(x=>x.id===id);
  if(!x)return;
  if(confirm(`Delete "${x.name}" from the Master List?`)){
    state.items=state.items.filter(i=>i.id!==id);
    state.route=state.route.filter(i=>i!==id);
    for(const k of Object.keys(state.pairs)){
      if(k.startsWith(id+"|")||k.endsWith("|"+id)) delete state.pairs[k];
    }
    save();render();
  }
}
function addStoreFromField(fieldId){
  const field=document.getElementById(fieldId);
  const current=field && field.value!=="__ADD_STORE__" ? field.value : "";
  const name=prompt("Enter the new store name:","");
  if(name===null)return;
  const clean=name.trim();
  if(!clean){alert("Please enter a store name.");return;}
  const existing=state.stores.find(st=>st.toLowerCase()===clean.toLowerCase());
  if(existing){
    ensureStore(existing);
    if(field){
      rebuildStoreSelect(fieldId,existing);
    }
    save();
    return;
  }
  ensureStore(clean);
  save();
  rebuildStoreSelect(fieldId,clean);
}
function rebuildStoreSelect(fieldId,selected){
  const field=document.getElementById(fieldId);
  if(!field || field.tagName!=="SELECT")return;
  const stores=state.stores.slice().sort((a,b)=>a.localeCompare(b,undefined,{sensitivity:"base"}));
  field.innerHTML=stores.map(st=>`<option value="${esc(st)}" ${st===selected?"selected":""}>${esc(st)}</option>`).join("")+`<option value="__ADD_STORE__">＋ Add new store…</option>`;
  field.value=selected;
}

function openStoreManager(){
  const stores=[...state.stores].sort((a,b)=>a.localeCompare(b,undefined,{sensitivity:"base"}));
  document.getElementById("sheet").innerHTML=`
    <h2>Manage stores</h2>
    <p class="muted">Add the places you shop. These stores will appear when you tap an item to set its amount and store.</p>
    <div class="store-list">
      ${stores.map(st=>`<div class="store-row"><span>${esc(st)}</span>${state.stores.length>1?`<button class="secondary" onclick="renameStore('${esc(st)}')">Rename</button><button class="secondary" onclick="deleteStore('${esc(st)}')">Delete</button>`:""}</div>`).join("")}
    </div>
    <div class="store-add">
      <input id="newStoreName" placeholder="New store name" autocomplete="off">
      <button class="primary" onclick="addStore()">Add store</button>
    </div>
    <div class="actions"><button class="secondary" onclick="closeModal()">Done</button></div>`;
  openModal();
  setTimeout(()=>document.getElementById("newStoreName")?.focus(),50);
}
function addStore(){
  const input=document.getElementById("newStoreName");
  const name=(input?.value||"").trim();
  if(!name){alert("Please enter a store name.");return;}
  const existing=state.stores.find(st=>st.toLowerCase()===name.toLowerCase());
  if(existing){alert("That store already exists.");return;}
  ensureStore(name);
  save();
  openStoreManager();
}
function renameStore(oldName){
  const current=state.stores.find(st=>st===oldName);
  if(!current)return;
  const next=prompt("Rename store:",current);
  if(next===null)return;
  const name=next.trim();
  if(!name||name===current)return;
  if(state.stores.some(st=>st.toLowerCase()===name.toLowerCase())){alert("That store already exists.");return;}
  state.stores=state.stores.map(st=>st===current?name:st);
  if(state.routesByStore[current]){state.routesByStore[name]=state.routesByStore[current];delete state.routesByStore[current]}
  if(state.pairsByStore[current]){state.pairsByStore[name]=state.pairsByStore[current];delete state.pairsByStore[current]}
  state.items.forEach(x=>{
    if(x.store===current)x.store=name;
    if(x.shopStore===current)x.shopStore=name;
  });
  save();
  openStoreManager();
}
function deleteStore(name){
  if(state.stores.length<=1){alert("Keep at least one store.");return;}
  const used=state.items.some(x=>x.store===name||x.shopStore===name);
  if(used){alert(`"${name}" is currently assigned to one or more items. Reassign those items before deleting this store.`);return;}
  if(!confirm(`Delete "${name}" from your store list?`))return;
  state.stores=state.stores.filter(st=>st!==name);
  delete state.routesByStore[name];
  delete state.pairsByStore[name];
  save();
  openStoreManager();
}
function openAdd(){
  const cats=CATEGORIES;
  document.getElementById("sheet").innerHTML=`
    <h2>Add item</h2>
    <input id="aiName" placeholder="Item name" autocomplete="off">
    <label class="muted">Store</label>
    <select id="aiStore" onchange="if(this.value==='__ADD_STORE__'){addStoreFromField('aiStore')}" >
      ${state.stores.slice().sort((a,b)=>a.localeCompare(b,undefined,{sensitivity:"base"})).map(st=>`<option value="${esc(st)}" ${st==="PAK'nSAVE"?"selected":""}>${esc(st)}</option>`).join("")}
      <option value="__ADD_STORE__">＋ Add new store…</option>
    </select>
    <button class="secondary" type="button" onclick="addStoreFromField('aiStore')">＋ Add new store</button>
    <select id="aiCat">
      ${cats.map(c=>`<option ${c==="Other"?"selected":""}>${esc(c)}</option>`).join("")}
    </select>
    <input id="aiQty" type="number" min="0" step="any" value="1">
    <select id="aiUnit">
      ${["each","bunch","kg","g","pack","bag","box","tin","jar","tub","bottle","loaf","tube","roll","pair","dozen","litre","ml"].map(u=>`<option>${u}</option>`).join("")}
    </select>
    <div class="actions">
      <button class="secondary" onclick="closeModal()">Cancel</button>
      <button class="primary" onclick="addItem()">Add</button>
    </div>`;
  openModal();
  setTimeout(()=>document.getElementById("aiName").focus(),50);
}
function addItem(){
  const name=document.getElementById("aiName").value.trim();
  const cat=document.getElementById("aiCat").value;
  const storeValue=document.getElementById("aiStore").value;
  const store=ensureStore(storeValue!=="__ADD_STORE__"?storeValue:"PAK'nSAVE");
  const q=document.getElementById("aiQty").value;
  const u=document.getElementById("aiUnit").value;
  if(!name){alert("Please enter an item name.");return;}
  if(state.items.some(x=>x.name.toLowerCase()===name.toLowerCase())){
    alert("That item already exists.");
    return;
  }
  state.items.push({
    id:name,name,category:cat,store,shopStore:store,usualQty:q,usualUnit:u,
    shopQty:q,shopUnit:u,selected:true,bought:false
  });
  save();closeModal();render();
}
function openShopItem(id){
  const x=state.items.find(x=>x.id===id);
  if(!x)return;
  const currentStore=x.shopStore||x.store||"PAK'nSAVE";
  document.getElementById("sheet").innerHTML=`
    <h2>${esc(x.name)}</h2>
    <p class="muted">Set what you want to buy this week.</p>
    <label class="muted">Amount</label>
    <input id="siQty" type="number" min="0" step="any" value="${esc(x.shopQty||x.usualQty||1)}">
    <select id="siUnit">
      ${["each","bunch","kg","g","pack","bag","box","tin","jar","tub","bottle","loaf","tube","roll","pair","dozen","litre","ml"].map(u=>`<option ${u===(x.shopUnit||x.usualUnit) ? "selected" : ""}>${u}</option>`).join("")}
    </select>
    <label class="muted">Store</label>
    <select id="siStore" onchange="if(this.value==='__ADD_STORE__'){addStoreFromField('siStore')}" >
      ${state.stores.slice().sort((a,b)=>a.localeCompare(b,undefined,{sensitivity:"base"})).map(st=>`<option value="${esc(st)}" ${st===currentStore?"selected":""}>${esc(st)}</option>`).join("")}
      <option value="__ADD_STORE__">＋ Add new store…</option>
    </select>
    <button class="secondary" type="button" onclick="addStoreFromField('siStore')">＋ Add new store</button>
    <div class="actions">
      <button class="secondary" onclick="closeModal()">Cancel</button>
      <button class="primary" onclick="saveShopItem('${esc(id)}')">Save</button>
    </div>`;
  openModal();
}
function saveShopItem(id){
  const x=state.items.find(x=>x.id===id);
  if(!x)return;
  x.shopQty=document.getElementById("siQty").value||"1";
  x.shopUnit=document.getElementById("siUnit").value;
  const shopStoreValue=document.getElementById("siStore").value;
  x.shopStore=ensureStore(shopStoreValue!=="__ADD_STORE__"?shopStoreValue:(x.shopStore||x.store||"PAK'nSAVE"));
  x.selected=true;
  x.bought=false;
  save();closeModal();render();
}
function openModal(){document.getElementById("modal").classList.add("show")}
function closeModal(){document.getElementById("modal").classList.remove("show")}
document.getElementById("modal").onclick=e=>{if(e.target.id==="modal")closeModal()}
document.getElementById("tabShop").onclick=()=>{window.view="shop";setTabs();render()}
document.getElementById("tabMaster").onclick=()=>{window.view="master";setTabs();render()}
document.getElementById("tabRoute").onclick=()=>{window.view="route";setTabs();render()}
function setTabs(){document.querySelectorAll(".tab").forEach(b=>b.classList.remove("active"));document.getElementById(window.view==="master"?"tabMaster":window.view==="route"?"tabRoute":"tabShop").classList.add("active")}
window.view="shop";render();
</script>

<script>
(() => {
  // Family testing access code. Change this before wider distribution.
  const FAMILY_ACCESS_CODE = "2580";
  const ACCESS_KEY = "paknsave_family_access_granted";

  const lock = document.getElementById("access-lock");
  const input = document.getElementById("access-code");
  const button = document.getElementById("unlock-app");
  const error = document.getElementById("access-error");

  function unlock() {
    if (input.value === FAMILY_ACCESS_CODE) {
      localStorage.setItem(ACCESS_KEY, "1");
      lock.classList.add("hidden");
      document.body.style.overflow = "";
    } else {
      error.textContent = "Incorrect access code.";
      input.select();
    }
  }

  if (localStorage.getItem(ACCESS_KEY) === "1") {
    lock.classList.add("hidden");
  } else {
    document.body.style.overflow = "hidden";
    setTimeout(() => input.focus(), 100);
  }

  button.addEventListener("click", unlock);
  input.addEventListener("keydown", (e) => {
    if (e.key === "Enter") unlock();
  });
})();
</script>
